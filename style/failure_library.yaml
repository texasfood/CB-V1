# Cyan Black — Failure Library
#
# Prompt patterns that produced unusable results.
# Populated during review sessions. Never delete entries — set archived: true instead.
# Review engine adds failures automatically when a prompt scores < 5.0.
#
# Format for each entry:
#   - pattern: "the exact fragment or phrase that failed"
#     reason: "why it failed — be specific"
#     category: "color | character | lighting | composition | mood | style"
#     context: "what type of prompt it appeared in"
#     date: "YYYY-MM-DD"
#     archived: false

failures:
