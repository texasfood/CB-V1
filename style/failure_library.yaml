    reason: "Placeholder example entry — replace after first review session"
    category: "style"
    context: "character standing pose"
    date: "2024-01-01"
    archived: true

# How to add a new failure:
# 1. Run `python codex.py review [prompt_id]` after testing a bad output
# 2. Identify which specific fragment caused the problem
# 3. Add an entry here manually with pattern, reason, category, context, and today's date
# 4. Also note it in style/visual_dna.md under "Failed Prompt Language"
