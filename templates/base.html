<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Codex{% endblock %} — Cyan Black</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/" class="brand">CB·CODEX</a>
      <div class="nav-links">
        <a href="/character" {% if request.path == '/character' %}class="active"{% endif %}>Character</a>
        <a href="/scene"     {% if request.path == '/scene'     %}class="active"{% endif %}>Scene</a>
        <a href="/log"       {% if request.path.startswith('/log') or request.path.startswith('/review') %}class="active"{% endif %}>Log</a>
        <a href="/patterns"  {% if request.path == '/patterns'  %}class="active"{% endif %}>Patterns</a>
      </div>
    </div>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    function copyPrompt(id) {
      const el = document.getElementById(id);
      navigator.clipboard.writeText(el.textContent.trim()).then(() => {
        const btn = document.getElementById(id + '-btn');
        const orig = btn.textContent;
        btn.textContent = 'Copied';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1800);
      });
    }
  </script>
</body>
</html>
