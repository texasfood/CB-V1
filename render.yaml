services:
  - type: web
    name: cb-codex
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CODEX_DATA_DIR
        value: /data
    disk:
      name: codex-data
      mountPath: /data
      sizeGB: 1
